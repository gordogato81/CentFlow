# version: '3.7'
services:
  # database:
  #   container_name: fish-database
  #   build: ./database
  #   restart: unless-stopped
  #   volumes:
  #     - database-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - fish
  #   env_file: ./secrets/.env

  cent-backend:
    container_name: centflow-backend
    build:
      context: ./Backend/
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "5000"
    # Application code is baked into the image (see Backend/Dockerfile.prod), so
    # nothing is bind-mounted over it here: the running container matches the
    # image that was built and scanned, and it runs as the non-root "nobody"
    # user, which a host-owned bind mount would break.
    # Access logs go to stdout and are collected by the Docker logging driver.
    networks:
      - fisheye_fish
    env_file: ./secrets/.env

  cent-frontend:
    container_name: centflow-frontend
    build:
      context: ./Frontend/
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
      - "443"
    volumes:
      - ./logs:/var/log/nginx
      # Reused NPM-managed certificate material mounted read-only into the frontend.
      - ${FRONTEND_TLS_CERT_PATH:?Set FRONTEND_TLS_CERT_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${FRONTEND_TLS_KEY_PATH:?Set FRONTEND_TLS_KEY_PATH}:/etc/nginx/certs/privkey.pem:ro
    networks:
      - fisheye_fish
      - npm_proxy

name: centflow
networks:
  fisheye_fish:
    external: true
  npm_proxy:
    external: true
    name: ${NPM_EXTERNAL_NETWORK:-npm_proxy}

volumes:
  database-data:
