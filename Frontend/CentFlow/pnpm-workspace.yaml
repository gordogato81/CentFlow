allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - '@angular/animations@22.1.6'
  - '@angular/common@22.1.6'
  - '@angular/compiler-cli@22.1.6'
  - '@angular/compiler@22.1.6'
  - '@angular/core@22.1.6'
  - '@angular/forms@22.1.6'
  - '@angular/platform-browser-dynamic@22.1.6'
  - '@angular/platform-browser@22.1.6'
  - '@angular/router@22.1.6'
overrides:
  '@hono/node-server': 2.1.0
  '@modelcontextprotocol/sdk': 1.30.0
  # Security pins for transitive advisories. These packages are pulled in only
  # through build/test tooling, but are pinned here to keep `pnpm audit` clean.
  #   6.16.0 fixes GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx
  #   3.1.6 fixes GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  #         GHSA-fph4-wmhf-6fwf and GHSA-jqff-g426-hqxp
  #   4.13.5 fixes GHSA-gqvv-2mrq-wpjv, GHSA-g6gw-c38x-mqfc and
  #          GHSA-crvj-82cr-hjcx
  fast-uri: 3.1.6
  hono: 4.13.7
  qs: 6.16.0
peerDependencyRules:
  allowedVersions:
    listr2: 10.2.2
